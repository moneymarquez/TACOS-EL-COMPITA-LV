<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>El Compita · Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<section id="login" class="login" hidden>
  <form id="login-form" class="card">
    <h1>El Compita Admin</h1>
    <p class="muted">Sign in to update the trucks' schedule, menu, photos, and site text.</p>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn--primary btn--wide" type="submit">Sign in</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</section>

<div id="app" hidden>
  <header class="bar">
    <strong>El Compita Admin</strong>
    <a href="/" target="_blank" rel="noopener">View site ↗</a>
    <button id="logout" class="link" type="button">Sign out</button>
  </header>
  <div id="email-warning" class="warn" hidden>
    Inquiry emails are <strong>not set up</strong>: <span id="email-warning-why"></span>. New inquiries still appear in the Inquiries tab.
  </div>
  <nav class="tabs" aria-label="Admin sections">
    <button data-tab="schedule" class="active">Schedule</button>
    <button data-tab="menu">Menu</button>
    <button data-tab="photos">Photos</button>
    <button data-tab="content">Text &amp; contact</button>
    <button data-tab="reviews">Reviews</button>
    <button data-tab="inquiries">Inquiries</button>
  </nav>
  <main id="panel" class="panel"></main>
</div>

<template id="tpl-schedule">
  <h2>Truck schedule</h2>
  <p class="muted">Add each stop with its date and hours. Stops show on the site from their date onward, and drop off automatically once the day has passed.</p>
  <form id="schedule-form" class="card grid">
    <input type="hidden" name="id">
    <label class="field"><span>Truck</span><select name="truck_id" id="truck-select" required></select></label>
    <label class="field"><span>Date</span><input name="date" type="date" required></label>
    <label class="field"><span>Start</span><input name="start_time" type="time" required></label>
    <label class="field"><span>End</span><input name="end_time" type="time" required></label>
    <label class="field field--full"><span>Location name (e.g. "Walmart parking lot, 3500 S")</span><input name="location_name" required maxlength="120"></label>
    <label class="field field--full"><span>Street address (used for the Get Directions button)</span><input name="street_address" maxlength="200" placeholder="3180 S 5600 W, West Valley City, UT 84120"></label>
    <label class="field field--full"><span>Custom map link (optional - paste a Google Maps share link to override the address)</span><input name="map_link" type="url" maxlength="500" placeholder="https://maps.app.goo.gl/..."></label>
    <label class="field field--full"><span>Note (optional, e.g. "Cash and card")</span><input name="note" maxlength="300"></label>
    <div class="field--full row">
      <button class="btn btn--primary" type="submit" id="schedule-submit">Add stop</button>
      <button class="btn" type="button" id="schedule-cancel" hidden>Cancel edit</button>
    </div>
  </form>
  <div class="row between">
    <h3>Stops</h3>
    <button class="link" type="button" id="clear-past">Delete past stops</button>
  </div>
  <div id="schedule-list"></div>
</template>

<template id="tpl-menu">
  <h2>Menu</h2>
  <div class="card">
    <h3>Categories</h3>
    <div id="category-list" class="chips"></div>
    <form id="category-form" class="row">
      <input name="name" placeholder="New category (e.g. Sides)" maxlength="60" required>
      <button class="btn" type="submit">Add category</button>
    </form>
  </div>
  <form id="item-form" class="card grid">
    <input type="hidden" name="id">
    <label class="field"><span>Category</span><select name="category_id" id="item-category" required></select></label>
    <label class="field"><span>Name</span><input name="name" required maxlength="80" placeholder="Asada taco"></label>
    <label class="field"><span>Price (blank = not set yet)</span><input name="price" inputmode="decimal" placeholder="3.00" maxlength="10"></label>
    <label class="field"><span>Availability</span>
      <select name="availability">
        <option value="available">Available</option>
        <option value="sold_out">Sold out (shown, tagged)</option>
        <option value="hidden">Hidden (not shown)</option>
      </select>
    </label>
    <label class="field field--full"><span>Short description (optional)</span><input name="description" maxlength="300" placeholder="Steak cut daily, onion, cilantro, salsa"></label>
    <div class="field--full row">
      <button class="btn btn--primary" type="submit" id="item-submit">Add item</button>
      <button class="btn" type="button" id="item-cancel" hidden>Cancel edit</button>
    </div>
  </form>
  <div id="item-list"></div>
</template>

<template id="tpl-photos">
  <h2>Photos</h2>
  <p class="muted">Photos are resized on your phone before upload (max 1600px), so uploads are quick and the site stays fast. JPG, PNG, or WebP.</p>
  <p class="muted">Each photo goes either in the <strong>gallery grid</strong> or in one of the design's picture spots: <strong>hero</strong> (big background at the top), <strong>location</strong>, <strong>menu</strong>, <strong>story</strong>, <strong>catering</strong>, or <strong>contact</strong>. Only the first photo assigned to a spot is used. The first gallery photo is the large tile.</p>
  <form id="photo-form" class="card grid">
    <label class="field field--full"><span>Image</span><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
    <label class="field"><span>Describe the photo (shown to screen readers and search engines)</span><input name="alt_text" required maxlength="200" placeholder="Three asada tacos with lime on the truck counter"></label>
    <label class="field"><span>Where it shows</span><select name="placement" id="placement-select"></select></label>
    <div class="field--full row"><button class="btn btn--primary" type="submit" id="photo-submit">Upload photo</button></div>
  </form>
  <div id="photo-list" class="photo-grid"></div>
</template>

<template id="tpl-content">
  <h2>Text &amp; contact</h2>
  <form id="settings-form" class="card grid">
    <h3 class="field--full">Hero</h3>
    <label class="field"><span>Headline (white line)</span><input name="hero_headline" maxlength="120"></label>
    <label class="field"><span>Headline, orange line (e.g. "$3 a taco.")</span><input name="hero_headline_accent" maxlength="60"></label>
    <label class="field field--full"><span>Subline</span><input name="hero_subline" maxlength="200"></label>
    <h3 class="field--full">Where We Are Today</h3>
    <label class="field field--full"><span>Section headline</span><input name="location_headline" maxlength="120"></label>
    <h3 class="field--full">Menu</h3>
    <label class="field"><span>Section headline</span><input name="menu_headline" maxlength="120"></label>
    <label class="field"><span>Short intro under the headline</span><input name="menu_lede" maxlength="200"></label>
    <h3 class="field--full">Our Story</h3>
    <label class="field field--full"><span>Section headline</span><input name="story_headline" maxlength="120"></label>
    <label class="field field--full"><span>Story text (blank line between paragraphs)</span><textarea name="story_text" rows="6" maxlength="5000"></textarea></label>
    <label class="field field--full"><span>Pull quote (shown in big type, attributed to the owner)</span><input name="story_quote" maxlength="120"></label>
    <h3 class="field--full">Catering</h3>
    <label class="field field--full"><span>Catering copy</span><textarea name="catering_copy" rows="4" maxlength="2000"></textarea></label>
    <h3 class="field--full">Contact (public)</h3>
    <label class="field"><span>Phone (click-to-call)</span><input name="phone" type="tel" maxlength="40" placeholder="(801) 555-0100"></label>
    <label class="field"><span>Public email</span><input name="email" type="email" maxlength="200"></label>
    <label class="field field--full"><span>Instagram link</span><input name="instagram_url" type="url" maxlength="300" placeholder="https://www.instagram.com/..."></label>
    <label class="field"><span>Service area</span><input name="service_area" maxlength="200"></label>
    <label class="field"><span>Hours summary (footer)</span><input name="hours_summary" maxlength="200" placeholder="Lunch and dinner, Tue-Sun"></label>
    <h3 class="field--full">Google rating (updated by hand)</h3>
    <label class="field"><span>Rating (e.g. 4.8)</span><input name="google_rating" inputmode="decimal" maxlength="3"></label>
    <label class="field"><span>Review count</span><input name="google_review_count" inputmode="numeric" maxlength="7"></label>
    <label class="field field--full"><span>Link to your Google reviews</span><input name="google_reviews_url" type="url" maxlength="500"></label>
    <h3 class="field--full">Catering inquiry notifications</h3>
    <label class="field field--full"><span>Send new inquiries to this email</span><input name="notify_email" type="email" maxlength="200"></label>
    <div class="field--full row"><button class="btn btn--primary" type="submit">Save all</button></div>
  </form>
  <div class="card">
    <h3>Trucks</h3>
    <div id="truck-list" class="grid"></div>
  </div>
</template>

<template id="tpl-reviews">
  <h2>Review quotes</h2>
  <p class="muted">Copy real quotes from your Google reviews. Set the overall rating under Text &amp; contact.</p>
  <form id="review-form" class="card grid">
    <input type="hidden" name="id">
    <label class="field"><span>Reviewer name</span><input name="reviewer_name" required maxlength="80"></label>
    <label class="field"><span>Stars</span><select name="star_rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
    <label class="field field--full"><span>Quote</span><textarea name="quote" rows="3" required maxlength="600"></textarea></label>
    <label class="field"><span>Source</span><input name="source" value="Google" maxlength="40"></label>
    <div class="field--full row">
      <button class="btn btn--primary" type="submit" id="review-submit">Add quote</button>
      <button class="btn" type="button" id="review-cancel" hidden>Cancel edit</button>
    </div>
  </form>
  <div id="review-list"></div>
</template>

<template id="tpl-inquiries">
  <div class="row between">
    <h2>Catering inquiries</h2>
    <a class="btn" href="/api/admin/inquiries.csv">Export CSV</a>
  </div>
  <div id="inquiry-list"></div>
</template>

<script src="/admin.js" defer></script>
</body>
</html>
